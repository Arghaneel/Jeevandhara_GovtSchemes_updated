# Move me to .github/workflows/ci.yml  (mkdir -p .github/workflows && mv ci/github-actions-ci.yml .github/workflows/ci.yml)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (API, chatbot, browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: for f in frontend/*.js; do node --check "$f"; done

      - name: Run tests
        run: pytest -v

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t jeevandhara:ci .

      - name: Start container and check health
        run: |
          docker run -d --name jeevandhara -p 8000:8000 jeevandhara:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/app/ | grep -q "Jeevandhara"
          curl -fsS http://127.0.0.1:8000/schemes/kcc | grep -q "Kisan Credit Card"

      - name: Show logs on failure
        if: failure()
        run: docker logs jeevandhara
