<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1E6A3A">
    <title>Log in - Jeevandhara</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-title-key="page.login">
    <a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to main content</a>

    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                    <rect width="32" height="32" rx="9" fill="#1E6A3A"/>
                    <path d="M16 25.5V15" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
                    <path d="M16 16.5c0-4.6-3.2-7.5-8.5-7.5 0 4.6 3.2 7.5 8.5 7.5z" fill="#E3A008"/>
                    <path d="M16 14.5c0-3.9 2.7-6.5 7.5-6.5 0 3.9-2.7 6.5-7.5 6.5z" fill="#fff"/>
                </svg>
                <span>Jeevandhara</span>
            </a>
            <div class="header-actions">
                <button class="lang-switch" id="lang-btn" type="button">हिंदी</button>
                <button class="icon-btn" id="theme-btn" type="button" data-i18n-title="theme.toggle"></button>
            </div>
        </div>
    </header>

    <main id="main" class="auth-main">
        <div class="panel auth-card">
            <h1 data-i18n="login.title">Log in</h1>
            <p class="muted" data-i18n="login.subtitle">Use the username and password you registered with.</p>

            <form onsubmit="event.preventDefault(); login();" novalidate>
                <div class="field">
                    <label for="username" data-i18n="field.username">Username</label>
                    <input type="text" id="username" class="input" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </div>

                <div class="field">
                    <label for="password" data-i18n="field.password">Password</label>
                    <div class="input-with-action">
                        <input type="password" id="password" class="input" autocomplete="current-password" required>
                        <button type="button" class="reveal-btn" data-reveal="password">Show</button>
                    </div>
                </div>

                <p id="msg" class="form-error" role="alert"></p>

                <button type="submit" id="submit-btn" class="btn btn-primary btn-lg btn-block">
                    <span data-i18n="login.submit">Log in</span>
                </button>
            </form>

            <p class="auth-switch" data-i18n-html="login.no_account">New to Jeevandhara? <a href="register.html">Create a free account</a></p>
        </div>

        <p class="auth-help" data-i18n-html="login.help">Need help? Read the <a href="help.html#help">help page</a> or call the Kisan Call Centre on <a href="tel:18001801551">1800-180-1551</a>.</p>
    </main>

    <div class="toast-container" id="toast-container"></div>

    <script src="common.js"></script>
    <script src="i18n.js"></script>
    <script src="login.js"></script>
</body>
</html>
